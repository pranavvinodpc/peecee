trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - script: echo "Building the application..."
      displayName: 'Build Step'

- stage: Test
  jobs:
  - job: TestJob
    steps:
    - script: echo "Running tests..."
      displayName: 'Test Step'
    - task: PowerShell@2
      inputs:
        filePath: 'scripts/test.ps1'
      displayName: 'Run PowerShell Test Script'
